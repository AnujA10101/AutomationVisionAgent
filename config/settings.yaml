app:
  name: AutomationVisionAgent
  debug: true

screen:
  monitor_index: 1
  screenshot_width: 1280

agent:
  max_steps: 8
  max_actions_per_step: 3
  action_delay_seconds: 0.35
  step_wait_seconds: 1.0
  retry_on_invalid_coordinates: true
  max_coordinate_retries: 1

llm:
  model: gpt-4.1-mini
  max_actions: 3
  temperature: 0

vision:
  coordinate_map_enabled: true
  grid_cols: 12
  grid_rows: 8
  fine_grid_spacing: 50
  save_coordinate_map_debug: true
  annotated_screenshots: true
  coordinate_grid_spacing: 100
  draw_cursor_marker: true
  draw_grid_labels: true
  hide_overlay_during_capture: true

targeting:
  use_bounding_boxes: true
  require_grid_cell: true
  require_click_point_inside_box: true
  require_box_inside_screenshot: true
  min_target_confidence: 0.70
  max_locator_retries: 2
  click_box_center: true
  enable_template_matching: true
  template_match_threshold: 0.78
  max_targeting_retries: 1
  fallback_to_action_planner: true
  require_user_confirmation_before_click: false
  # If the next targeting click center is within this distance (capture px) of the last
  # targeting click, skip repeat clicks and use the action planner instead. Set 0 to disable.
  duplicate_click_min_distance_px: 28

actions:
  allow_hotkeys: false
  allow_press: false

safety:
  pyautogui_failsafe: true
  emergency_stop_key: escape
  # MVP test click must run without a confirmation dialog (not implemented yet).
  require_confirmation_for_risky_actions: false
